#
# Automatically generated by OPNsense (IGMP Proxy Plus) - do not edit
#
{% if helpers.exists('OPNsense.igmpproxyplus.general') %}
{% set g = OPNsense.igmpproxyplus.general %}
controlsocket /var/run/igmpproxy-plus.sock
eventlog /var/log/igmpproxy-plus-events.jsonl
eventlogsize 1024
fastleave {{ g.fastleave|default('off') }}
robustness {{ g.robustness|default('2') }}
queryinterval {{ g.query_interval|default('125') }}s
queryresponseinterval {{ g.query_response_interval|default('10') }}s
{% if g.startup_query_interval %}
startupqueryinterval {{ g.startup_query_interval }}s
{% endif %}
{% if g.startup_query_count %}
startupquerycount {{ g.startup_query_count }}
{% endif %}
lastmemberinterval {{ g.last_member_interval|default('1000') }}ms
{% if g.last_member_count %}
lastmembercount {{ g.last_member_count }}
{% endif %}
upstreamleavedelay {{ g.upstream_leave_delay|default('0') }}ms
hostlimit {{ g.host_limit|default('256') }}
queryversion {{ g.query_version|default('3') }}
stalltimeout {{ g.stall_timeout|default('10') }}s
{% if g.querier_election == '1' %}
querierelection on
{% endif %}

{% for intf in helpers.toList('OPNsense.igmpproxyplus.interfaces.interface') %}
{%   if intf.enabled == '1' %}
{%     set dev = helpers.physical_interface(intf.interface) %}
{%     if dev %}
# {{ intf.interface }}{% if intf.description %} - {{ intf.description }}{% endif %}

phyint {{ dev }} {{ intf.direction }}
{%       if intf.threshold %}
    threshold {{ intf.threshold }}
{%       endif %}
{%       if intf.direction == 'downstream' and intf.fastleave %}
    fastleave {{ intf.fastleave }}
{%       endif %}
{%       if intf.direction == 'downstream' and intf.group_timeout %}
    grouptimeout {{ intf.group_timeout }}s
{%       endif %}
{%       if intf.direction in ['downstream', 'querier'] %}
{%         if intf.querier_election == '1' %}
    querierelection on
{%         elif intf.querier_election == '0' %}
    querierelection off
{%         endif %}
{%         if intf.robustness %}
    robustness {{ intf.robustness }}
{%         endif %}
{%         if intf.last_member_interval %}
    lastmemberinterval {{ intf.last_member_interval }}ms
{%         endif %}
{%         if intf.last_member_count %}
    lastmembercount {{ intf.last_member_count }}
{%         endif %}
{%         if intf.query_version %}
    queryversion {{ intf.query_version }}
{%         endif %}
{%       endif %}
{%       if intf.direction != 'querier' %}
{%       for net in (intf.altnet|default('')).split(',') if net %}
    altnet {{ net }}
{%       endfor %}
{%       for net in (intf.whitelist|default('')).split(',') if net %}
    whitelist {{ net }}
{%       endfor %}
{%       for net in (intf.blacklist|default('')).split(',') if net %}
    blacklist {{ net }}
{%       endfor %}
{%       endif %}
{%       if intf.direction == 'downstream' and g.proxy_ssdp != '1' %}
    blacklist 239.255.255.250/32
    blacklist 224.0.1.187/32
{%       endif %}

{%     endif %}
{%   endif %}
{% endfor %}
{% endif %}
