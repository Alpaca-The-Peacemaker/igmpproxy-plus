[start]
command:/usr/local/etc/rc.d/igmpproxy_plus start
parameters:
type:script
message:starting IGMP Proxy Plus

[stop]
command:/usr/local/etc/rc.d/igmpproxy_plus stop; exit 0
parameters:
type:script
message:stopping IGMP Proxy Plus

[restart]
command:/usr/local/etc/rc.d/igmpproxy_plus restart
parameters:
type:script
message:restarting IGMP Proxy Plus

[status]
command:/usr/local/etc/rc.d/igmpproxy_plus status; exit 0
parameters:
type:script_output
message:requesting IGMP Proxy Plus status

[groups]
command:/usr/local/sbin/igmpproxy-plus -S /var/run/igmpproxy-plus.sock 2>/dev/null || echo '{"error":"IGMP Proxy Plus is not running"}'
parameters:
type:script_output
message:requesting IGMP Proxy Plus group table
