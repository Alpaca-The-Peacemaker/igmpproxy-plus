name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daemon:
    name: Daemon build and leave-time test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake tcpdump
          ./autogen.sh && ./configure && make
      - name: Namespace test (fast leave on must stop traffic at once)
        run: |
          sudo python3 tools/nstest.py "$PWD/src/igmpproxy" plus-on "fastleave on" > result.json
          python3 - <<'EOF'
          import json
          r = json.load(open("result.json"))
          a = r["A_single_leave"]
          print(a)
          assert a["received_before_leave"], "receiver never got traffic"
          assert a["stop_latency_s"] < 0.5, "traffic did not stop after leave"
          EOF

  openwrt:
    name: OpenWrt ${{ matrix.release }} ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        release: ['25.12.6', '24.10.8']
        target:
          - x86/64
          - mediatek/filogic
          - bcm27xx/bcm2711
          - armsr/armv8
          - ramips/mt7621
          - ath79/generic
          - ipq40xx/generic
          - mvebu/cortexa9
          - ipq806x/generic
    steps:
      - uses: actions/checkout@v4
      - name: SDK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext libncurses-dev python3-setuptools rsync unzip zstd file wget
      - name: Build packages
        run: sh tools/openwrt-build.sh "${{ matrix.release }}" "${{ matrix.target }}" out
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ strategy.job-index }}
          path: out/*

  release:
    needs: [daemon, openwrt]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the package version
        run: |
          ver=$(sed -n 's/^PKG_VERSION:=//p' openwrt/net/igmpproxy-plus/Makefile)
          test "v$ver" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$ver"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Add installer and checksums
        run: |
          cp install.sh assets/
          cd assets && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
